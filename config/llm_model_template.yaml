# copy this file as: llm_model.yaml in the same directory and fill in your api key.

text:
  # use openrouter api
  # model: "x-ai/grok-4.1-fast"
  # api_base: "https://openrouter.ai/api/v1"
  # api_key: "xxxx"
  # api_key_env: "xxx"

  # use ollama api
  model: "nemotron-3-nano:30b"
  api_base: "http://localhost:11434/v1"
  api_key: "ollama"
  api_key_env: "ollama"

  # use aihubmix api
  # model: "gpt-4.1-mini"
  # api_base: "https://aihubmix.com/v1"
  # api_key: "xxxx"

# fellow lookup mode:
# - local_only: DuckDuckGo + Selenium + local text LLM (default, no OpenRouter required)
# - local_with_fallback: local flow first, fallback to OpenRouter when all Unknown or local errors
# - openrouter_only: keep legacy OpenRouter web-search flow
fellow_lookup:
  mode: "local_only"
  allow_wikipedia: true
  max_results: 5
  profile_char_limit: 8000
  min_profile_chars: 200
  extract_markdown_mode: "bs4_body" # default single-strategy mode for faster fellow lookup; set auto to enable multi-strategy
  debug_markdown_max_chars: 20000
  rule_assisted_honor_detection: true

# OpenRouter settings are only required when:
# - fellow_lookup.mode = local_with_fallback
# - fellow_lookup.mode = openrouter_only
openrouter_web_search:

  model: "x-ai/grok-4.1-fast"
  api_base: "https://openrouter.ai/api/v1"
  api_key: "xxxxx"
  api_key_env: "xxxxx"
  web_search_mode: "plugins"
  max_results: 5
  timeout_s: 60
